name: Hot News Crawler

on:
  schedule:
    # 每小时一次，保持原仓库的采集频率（UTC）。
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTIONS: true
        run: |
          # 无新报告时让任务失败，避免把旧 data.json 当作本次采集结果发布。
          uv run python -c "from pathlib import Path; Path('data.json').unlink(missing_ok=True)"
          uv run python -m trendradar
          test -s data.json

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Update website files
        run: |
          cp -r frontend/dist/* .
          touch .nojekyll

      - name: Commit generated files
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # SQLite 随产物一并保存，下一次运行才能累计当日新闻。
          git add -- data.json index.html assets output .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          TIMESTAMP=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          git commit -m "Auto update by GitHub Actions at $TIMESTAMP"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH_NAME"
            if git push origin "HEAD:$BRANCH_NAME"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
